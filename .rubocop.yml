AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# RSpec example blocks are legitimately long; the metric fights the DSL.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# Contract registries (one row per API operation) are long by design.
Metrics/ModuleLength:
  Exclude:
    - "spec/**/*"

Metrics/MethodLength:
  Max: 15
  Exclude:
    - "spec/**/*"

Layout/LineLength:
  Max: 120
  Exclude:
    - "*.gemspec"

# The gem is `kit-rb`; this dashed entry file is the canonical require path.
Naming/FileName:
  Exclude:
    - "lib/kit-rb.rb"

# Named keyword forwarding reads better in a public constructor than anonymous **.
Style/ArgumentsForwarding:
  Enabled: false

# A configuration object legitimately takes many keyword options.
Metrics/ParameterLists:
  CountKeywordArgs: false

# Value-object `.from` factories are flat field mappings: their ABC size scales
# with the number of fields and carries no complexity signal.
Metrics/AbcSize:
  Exclude:
    - "lib/kit/objects/**/*"
